schema: controltower.native_repo_adapter.v1
repo: CITY
interface_version: 1
description: Evidence-reconciled native ControlTower adapter for CITY.
capabilities:
- id: city.health
  description: Check original byte integrity and governance.
- id: city.next-action
  description: Read the next permitted verification action.
- id: city.rollback-plan
  description: Plan rollback without executing it.
- id: city.strategic-status
  description: Read current proof and authority.
- id: city.validation-state
  description: Read exact-HEAD verification receipt state.
- id: city.verify-release
  description: Execute the frozen stored-release verifier.
actions:
- id: city.health
  capability: city.health
  argv:
  - ./start.sh
  - health
  - --json
  mutability: read_only
  timeout_seconds: 30
  expected_json:
    /action: health
    /claims/live_unreal_from_city: false
    /claims/phase_5_authorized: false
    /repo: CITY
    /schema: city.native.v1
    /status: pass
  receipt_path: .controltower/receipts/native-city-health.json
  failure_code: CITY_CITY_HEALTH_FAILED
  rollback_link: AGENTS.md
  requires_lease: false
  allow_forwarded_args: false
  effects:
    source: none
    runtime: none
    evidence: receipt
    external: none
- id: city.next-action
  capability: city.next-action
  argv:
  - ./start.sh
  - next-action
  - --json
  mutability: read_only
